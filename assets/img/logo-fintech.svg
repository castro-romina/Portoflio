<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fondo redondeado -->
  <rect width="120" height="120" rx="24" fill="#0D47A1"/>
  
  <!-- Símbolo central - Billetera/Card -->
  <g transform="translate(60, 60)">
    <!-- Billetera exterior -->
    <rect x="-28" y="-18" width="56" height="36" rx="4" fill="none" stroke="#90CAF9" stroke-width="2.5"/>
    
    <!-- Línea horizontal divisoria -->
    <line x1="-28" y1="-2" x2="28" y2="-2" stroke="#90CAF9" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Tarjeta dentro -->
    <rect x="-20" y="4" width="28" height="14" rx="2" fill="#E3F2FD" opacity="0.9"/>
    
    <!-- Puntos de seguridad/conexión -->
    <circle cx="14" cy="11" r="1.5" fill="#0D47A1"/>
    <circle cx="18" cy="11" r="1.5" fill="#0D47A1"/>
    <circle cx="22" cy="11" r="1.5" fill="#0D47A1"/>
    
    <!-- Símbolo de dinero/moneda -->
    <circle cx="-12" cy="13" r="4" fill="none" stroke="#90CAF9" stroke-width="1.5"/>
    <text x="-12" y="15" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#90CAF9" text-anchor="middle" dominant-baseline="middle">$</text>
  </g>
  
  <!-- Texto FINTECH -->
  <text x="60" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E3F2FD" text-anchor="middle" letter-spacing="1">FINTECH</text>
</svg>